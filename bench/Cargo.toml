[package]
name = "chisel-bench"
version = "0.1.0"
edition = "2021"
description = "Benchmark harness for Chisel — Engine trait abstraction, workload generators, and cross-engine comparison runners. Internal use only; not published."
publish = false

[dependencies]
chisel = { path = ".." }
redb = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
tempfile = "3"
