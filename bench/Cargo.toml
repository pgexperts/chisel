[package]
name = "chisel-bench"
version = "0.1.0"
edition = "2021"
# MSRV mirrors the root crate (1.82). The path-dep on chisel inherits its
# floor; bench-specific deps (criterion, rusqlite, clap) all support older
# Rust, so bench is never the constraining factor.
rust-version = "1.82"
authors = ["Christophe Pettus <cpettus@pgexperts.com>"]
description = "Benchmark harness for Chisel — Engine trait abstraction, workload generators, and cross-engine comparison runners. Internal use only; not published."
license = "MIT"
repository = "https://github.com/Xof/chisel"
# publish = false because this crate is internal-only (no PyPI/crates.io
# distribution surface). The license + repository are still set so the
# subcrate's Cargo.toml is internally consistent with the root.
publish = false

[dependencies]
chisel = { path = ".." }
redb = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
chrono = "0.4"
walkdir = "2"
# I61 (ISSUES.md, 2026-05-22): tilde-range `~4.5` (= >=4.5.0, <4.6.0)
# is required because clap_derive 4.6.0+ pulls in the cargo
# `edition2024` feature, which isn't stable until Rust 1.85. Our MSRV
# is 1.82 (pinned by Option::is_none_or; see root Cargo.toml). Lift the
# pin when MSRV moves past 1.85 OR when clap_derive backs out the
# edition2024 requirement on 4.6.x.
clap = { version = "~4.5", features = ["derive"] }
hostname = "0.4"

[dev-dependencies]
criterion = "0.5"
assert_cmd = "2"
regex = "1"

[[bench]]
name = "micro_grid"
harness = false

[[bench]]
name = "scenarios"
harness = false

[[bin]]
name = "summarize"
path = "src/bin/summarize.rs"

[[bin]]
name = "chisel-bench-diff"
path = "src/bin/diff.rs"

[[bin]]
name = "chisel-bench-noise-gate"
path = "src/bin/noise_gate.rs"
