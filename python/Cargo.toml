[package]
name = "chisel-py"
version = "0.1.0"
edition = "2021"
# MSRV mirrors the root crate (1.82, from Option::is_none_or in chisel's
# page_cache). PyO3 0.22 itself only needs 1.63, but the path-dep on the
# root crate makes its floor ours too.
rust-version = "1.82"
authors = ["Christophe Pettus <cpettus@pgexperts.com>"]
description = "PyO3 binding for the Chisel transactional storage engine"
license = "MIT"
repository = "https://github.com/Xof/chisel"
readme = "README.md"
keywords = ["database", "storage", "embedded", "pyo3", "python"]
categories = ["database-implementations", "api-bindings"]
# Published to PyPI as `chisel` via maturin; this Cargo crate
# (`chisel-py`) is the build artifact, not the Rust crates.io
# distribution surface.
publish = false

[lib]
name = "_chisel"
crate-type = ["cdylib"]

[dependencies]
chisel = { path = ".." }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
