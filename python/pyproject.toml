[build-system]
# 1.12 floor: the first release that both emits PEP 639 License-Expression /
# License-File for the `license` / `license-files` keys below (1.9.2+) and can
# build this workspace's sdist at all -- 1.11 and older abort on the README.md
# the root crate and this package both contribute (maturin #2987).
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
# Published on PyPI as "chisel-storage" (plain "chisel" is already taken by
# an unrelated package). The importable module stays `chisel` — module-name
# and python-source below are untouched by this, so `import chisel` keeps
# working regardless of the distribution name pip installs.
name = "chisel-storage"
version = "1.0.0"
description = "Python binding for the Chisel transactional storage engine"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 form, so the wheel carries the license text (.dist-info/licenses/)
# and METADATA gains License-Expression / License-File; the legacy
# `{ text = ... }` table put only the word "MIT" in metadata and shipped no
# license file in the wheel at all.
#
# python/LICENSE.txt is a copy of the repo-root LICENSE, needed because
# license-files paths resolve relative to this file and may not climb out of
# it; ci.yml's python job fails if the two drift apart. It is deliberately NOT
# named plain LICENSE: maturin relocates this pyproject.toml to the sdist root,
# where the root crate's own LICENSE already sits, and refuses the second file
# at the same path ("was already added"), so the sdist would not build.
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Christophe Pettus" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/pgexperts/chisel"
Repository = "https://github.com/pgexperts/chisel"
Documentation = "https://github.com/pgexperts/chisel/blob/main/python/README.md"
Issues = "https://github.com/pgexperts/chisel/issues"

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[tool.maturin]
module-name = "chisel._chisel"
python-source = "."
features = ["pyo3/extension-module"]
include = [
    { path = "chisel/py.typed", format = "wheel" },
    { path = "chisel/__init__.pyi", format = "wheel" },
]
