name: Build wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # I59 (ISSUES.md, 2026-05-22): early cargo test gate. Without this,
  # a tagged commit that's broken would still build wheels (cibuildwheel
  # only runs pytest after the long wheel-build step) and fail very late.
  # This job runs first, blocks both `wheels` and `sdist` via `needs:`,
  # and adds ~30s of latency to a tag build in exchange for failing fast
  # if the underlying Rust is broken. Bench-test the bench subcrate is
  # already covered on every push by ci.yml's bench-tests job; we only
  # gate the root crate here.
  cargo-test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release

  # One native runner per target arch -- no QEMU, no cross-compilation.
  # Each runner builds only its own architecture (cibuildwheel's default
  # CIBW_ARCHS=auto), which removes the two failure modes the old single
  # ubuntu+macos matrix hit: x86_64-on-arm64-macOS cross-builds needed a
  # rustup target that was not installed, and aarch64-Linux under QEMU
  # emulation ran for 6h and was killed. Linux wheels build inside a
  # manylinux container that ships no Rust, so CIBW_BEFORE_ALL_LINUX
  # installs a native toolchain there; macOS builds on the host and uses
  # the host toolchain from rust-toolchain below.
  wheels:
    needs: cargo-test-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest     # Linux x86_64
          - runner: ubuntu-24.04-arm  # Linux aarch64 (native ARM runner)
          - runner: macos-13          # macOS x86_64 (Intel)
          - runner: macos-latest      # macOS arm64 (Apple Silicon)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.19
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BUILD_FRONTEND: "build"
          CIBW_BEFORE_BUILD: "pip install maturin"
          # manylinux containers ship no Rust; install a native toolchain
          # (fast -- native arch, no emulation) and put cargo on PATH.
          CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_TEST_REQUIRES: "pytest hypothesis"
          CIBW_TEST_COMMAND: "pytest {package}/tests"
        with:
          package-dir: python

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.runner }}
          path: wheelhouse/*.whl

  sdist:
    needs: cargo-test-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist
        working-directory: python
        run: maturin sdist -o ../dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
