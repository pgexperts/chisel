name: Build wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # I59 (ISSUES.md, 2026-05-22): early cargo test gate. Without this,
  # a tagged commit that's broken would still build wheels (cibuildwheel
  # only runs pytest after the long wheel-build step) and fail very late.
  # This job runs first, blocks both `wheels` and `sdist` via `needs:`,
  # and adds ~30s of latency to a tag build in exchange for failing fast
  # if the underlying Rust is broken. Bench-test the bench subcrate is
  # already covered on every push by ci.yml's bench-tests job; we only
  # gate the root crate here.
  cargo-test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release

  wheels:
    needs: cargo-test-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.19
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_SKIP: "*-musllinux_* *-win_*"
          CIBW_BEFORE_BUILD: "pip install maturin"
          CIBW_BUILD_FRONTEND: "build"
          CIBW_TEST_REQUIRES: "pytest hypothesis"
          CIBW_TEST_COMMAND: "pytest {package}/tests"
        with:
          package-dir: python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    needs: cargo-test-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist
        working-directory: python
        run: maturin sdist -o ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
