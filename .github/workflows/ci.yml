name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  # I54 (ISSUES.md, 2026-05-22): supply-chain advisory check via cargo-audit.
  # Runs against the RustSec advisory database. Currently the root crate
  # ships with only `xxhash-rust` and `libc` as production deps — both
  # well-maintained — so the practical risk surface is small. Catches any
  # vulnerable transitive dep that creeps in via a future change.
  #
  # Permissions notes:
  #   * `pull-requests: write` lets the action post per-line annotations
  #     on PR runs.
  #   * `checks: write` is needed on push-to-main runs — without it the
  #     action's annotation-posting step trips "Resource not accessible
  #     by integration" because GitHub restricts GITHUB_TOKEN's check-run
  #     write scope on push events by default.
  #
  # No `ignore:` list right now. The previous RUSTSEC-2024-0436 ignore
  # (paste 1.0.15 unmaintained) was removed when I72 landed and swapped
  # the dev-dep for the maintained `pastey` fork. If a future advisory
  # needs ignoring, file an ISSUES.md entry explaining why before adding
  # the ignore — don't let the list accumulate silently.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # I55 (ISSUES.md, 2026-05-22): pin MSRV in CI. Cargo.toml declares
  # rust-version = "1.82" (the floor stabilized by Option::is_none_or in
  # src/page_cache.rs). This job installs exactly that toolchain and runs
  # `cargo build` to verify the floor still works — catches any new code
  # that requires a newer Rust without an accompanying release-notes call-out.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.82
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Build with MSRV toolchain
        run: cargo build --verbose

  # I58 (ISSUES.md, 2026-05-22): the bench/ subcrate is a sibling, not
  # a workspace member, so `cargo test` from the repo root does NOT run
  # its tests. The bench.yml workflow only runs the scenario *bench*
  # tier on PRs for regression-comment purposes — it never runs
  # `cargo test`. This job closes the coverage hole that the
  # spillway-rollout retrospective (ARCHITECTURE.md Implementation
  # history → Lessons learned, #1) flagged.
  bench-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench
      - name: Run bench subcrate tests
        working-directory: bench
        run: cargo test --verbose

  python:
    needs: [test, clippy, fmt]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtualenv
        working-directory: python
        run: python -m venv .venv

      - name: Install maturin and test deps
        working-directory: python
        run: |
          . .venv/bin/activate
          pip install --upgrade pip
          pip install maturin pytest hypothesis

      - name: Build and install
        working-directory: python
        run: |
          . .venv/bin/activate
          maturin develop --release

      - name: Run tests
        working-directory: python
        run: |
          . .venv/bin/activate
          pytest -v
